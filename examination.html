<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examination</title>
</head>
<link rel="stylesheet" href="examination.css">
<body>
    <div class="question-container" id="quiz">
        <div class="question-header">
            <h2 id="question">ຄຳຖາມ</h2>
            <ul>
                <li>
                    <input type="radio" name="answer" id="a" class="answer">
                    <label for="a" id="a-text">ກ.</label>
                </li>
                <li>
                    <input type="radio" name="answer" id="b" class="answer">
                    <label for="b" id="b-text">ຂ.</label>
                </li>
                <li>
                    <input type="radio" name="answer" id="c" class="answer">
                    <label for="c" id="c-text">ຄ.</label>
                </li>
                <li>
                    <input type="radio" name="answer" id="d" class="answer">
                    <label for="d" id="d-text">ງ.</label>
                </li>
            </ul>
        </div>
        <button type="submit" id="submit">ສົ່ງຄຳຕອບ</button>
    </div>


    <script src="examination.js"></script>
</body>
</html>
